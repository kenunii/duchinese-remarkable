<!doctype html><meta charset="utf-8"><title>Textbook OCR comparison</title>
<style>body{font:16px system-ui;margin:0;background:#f6f6f6;color:#111}header{position:sticky;top:0;background:white;padding:14px;z-index:2;border-bottom:1px solid #ccc}select,button{font:inherit;margin-right:12px;padding:5px}main{display:grid;grid-template-columns:minmax(0,3fr) minmax(300px,1fr);gap:16px;padding:16px}canvas{width:100%;background:white}aside{height:85vh;overflow:auto;background:white;padding:16px}pre{white-space:pre-wrap;font:16px system-ui}.line{padding:6px;border-bottom:1px solid #eee;cursor:pointer}.selected{background:#ffeaaa}small{color:#555}</style>
<header><b>Untouched OCR</b> &nbsp; <select id="page">PAGES</select><select id="engine"><option value="paddle">PaddleOCR v5</option><option value="tesseract">Tesseract</option></select><label><input id="boxes" type="checkbox" checked>Character boxes</label> &nbsp; <button id="fit">Fit content</button><span id="summary"></span></header>
<main><section><canvas id="scan"></canvas><p><small>Click a text region to inspect recognition and confidence. No OCR correction or LLM annotation was applied. Chinese CER excludes punctuation, numbers and pinyin; page 23 scores dialogue only.</small></p></section><aside><h3>Chinese text comparison</h3><pre id="errors"></pre><h3>Selected region</h3><pre id="detail">Click the image or a line below.</pre><h3>Reading order</h3><div id="lines"></div></aside></main>
<script>const data=DATA;const page=document.querySelector('#page'),engine=document.querySelector('#engine'),boxToggle=document.querySelector('#boxes'),canvas=document.querySelector('#scan'),ctx=canvas.getContext('2d');let image=new Image(),crop=null,current=null,selected=-1,fit=true;
function draw(){if(!image.complete||!image.naturalWidth)return;const w=image.naturalWidth,h=image.naturalHeight;crop=fit?(Number(page.value)%2===0?[w*.03,h*.10,w*.43,h*.87]:[w*.51,h*.10,w*.45,h*.87]):[0,0,w,h];canvas.width=crop[2];canvas.height=crop[3];ctx.drawImage(image,...crop,0,0,canvas.width,canvas.height);ctx.save();ctx.translate(-crop[0],-crop[1]);current.lines.forEach((l,i)=>{if(boxToggle.checked)l.characters.forEach((c,j)=>{if(!/[㐀-鿿]/.test(c.text))return;ctx.beginPath();c.polygon.forEach((p,k)=>k?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();ctx.strokeStyle=['#d00000','#0060c0','#008040'][j%3];ctx.lineWidth=2;ctx.stroke();});if(i===selected){const b=l.box;ctx.strokeStyle='#000';ctx.lineWidth=5;ctx.strokeRect(b[0],b[1],b[2]-b[0],b[3]-b[1]);}});ctx.restore();}
function select(i){selected=i;const l=current.lines[i];document.querySelector('#detail').textContent=l?'Line '+i+' | confidence '+l.confidence.toFixed(3)+'\n'+l.text+'\n\n'+l.characters.map(c=>c.text).join(' | '):'No text region';document.querySelectorAll('.line').forEach((n,j)=>n.classList.toggle('selected',j===i));draw();}
function load(){current=data[page.value][engine.value];selected=-1;document.querySelector('#detail').textContent='Click the image or a line below.';document.querySelector('#errors').textContent='Raw order: '+current.errors+' edits. Spatial order: '+current.spatial_errors+' edits. '+current.lines_below_095+'/'+current.chinese_lines+' Chinese lines below 0.95 confidence. '+current.edits.map(e=>e.kind+': '+(e.reference||'∅')+' → '+(e.ocr||'∅')).join('; ');document.querySelector('#summary').textContent=' '+current.errors+'/'+current.reference_characters+' Chinese edits ('+(100*current.cer).toFixed(2)+'%)';const lines=document.querySelector('#lines');lines.replaceChildren();current.lines.forEach((l,i)=>{let n=document.createElement('div');n.className='line';n.textContent=i+' ['+l.confidence.toFixed(3)+'] '+l.text;n.onclick=()=>select(i);lines.append(n)});image=new Image();image.onload=draw;image.src='page-'+page.value+'.png';}
canvas.onclick=e=>{const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width+crop[0],y=(e.clientY-r.top)*canvas.height/r.height+crop[1];select(current.lines.findIndex(l=>x>=l.box[0]&&x<=l.box[2]&&y>=l.box[1]&&y<=l.box[3]));};page.onchange=engine.onchange=load;boxToggle.onchange=draw;document.querySelector('#fit').onclick=()=>{fit=!fit;draw()};load();</script>
