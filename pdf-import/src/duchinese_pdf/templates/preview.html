<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF-Vorschau</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e7e2;color:#202020;font:16px system-ui,sans-serif}header{position:sticky;top:0;z-index:5;background:#faf9f6;border-bottom:1px solid #c9c6be;padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font-size:17px;margin:0 auto 0 0}button,select{font:inherit;padding:6px 10px;border:1px solid #aaa;border-radius:5px;background:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}#status{font-size:13px;color:#555}#translation{position:sticky;top:65px;z-index:4;padding:12px 22px;background:#fff9db;border-bottom:1px solid #d9c889;max-height:24vh;overflow:auto}#translation[hidden]{display:none}#sheet{position:relative;width:min(1100px,100%);margin:20px auto;background:white;box-shadow:0 2px 14px #0002}#scan{display:block;width:100%;height:auto}#regions{position:absolute;inset:0}.region{position:absolute;margin:0;padding:0;border:0;border-radius:0;background:transparent}.region:hover,.region:focus-visible{background:#f2cc4260;outline:1px solid #aa891b}.region.selected{background:#f2cc4280;outline:1px solid #aa891b}body.boxes .region{outline:1px solid #376fa966}#popup{position:fixed;z-index:10;max-width:min(420px,90vw);background:#fff;border:1px solid #888;border-radius:10px;box-shadow:0 6px 30px #0003;padding:16px 20px}#popup[hidden]{display:none}#hanzi{font-size:30px}#pinyin{color:#755a16;font-size:20px;margin:4px 0}#meaning{line-height:1.5}#close{float:right;border:0}footer{text-align:center;padding:15px;color:#555;font-size:13px}
</style>
<header><h1 id="title"></h1><button id="prev" aria-label="Vorherige Seite">←</button><select id="pages" aria-label="PDF-Seite"></select><button id="next" aria-label="Nächste Seite">→</button><label><input id="boxes" type="checkbox"> Textregionen</label><span id="status"></span></header>
<div id="translation" hidden></div><main id="sheet"><img id="scan" alt="Original-PDF-Seite"><div id="regions"></div></main>
<aside id="popup" hidden><button id="close" aria-label="Schließen">×</button><div id="hanzi"></div><div id="pinyin"></div><div id="meaning"></div></aside>
<footer>Ein chinesisches Wort anklicken: Pinyin, Bedeutung und Satzübersetzung. ← / → blättert; Esc schließt.</footer>
<script>
const book=__BOOK_DATA__;
const $=id=>document.getElementById(id);let current=0;
$('title').textContent=book.title;document.title=book.title+' — PDF-Vorschau';
const labels={validated:'Wortdaten geprüft', 'image-only':'Originalseite · kein chinesischer Text erkannt',failed:'Originalseite · Wortdaten nicht freigegeben',pending:'Noch in Verarbeitung'};
book.pages.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`PDF ${p.page} · ${labels[p.status]||p.status}`;$('pages').append(o)});
function closePopup(){$('popup').hidden=true;$('translation').hidden=true;document.querySelectorAll('.selected').forEach(x=>x.classList.remove('selected'))}
function selectWord(index,event){closePopup();const page=book.pages[current],word=page.data.words[index];$('hanzi').textContent=word.hanzi;$('pinyin').textContent=word.pinyin;$('meaning').textContent=word.meaning;$('translation').textContent=page.data.sentences[word.sentence].translation;$('translation').hidden=false;
const box=event.currentTarget.getBoundingClientRect(),pop=$('popup');pop.hidden=false;pop.style.left=Math.max(8,Math.min(box.left,innerWidth-pop.offsetWidth-8))+'px';pop.style.top=Math.max(80,Math.min(box.bottom+10,innerHeight-pop.offsetHeight-8))+'px';document.querySelectorAll(`[data-word="${index}"]`).forEach(x=>x.classList.add('selected'));}
function showPage(index){current=Math.max(0,Math.min(book.pages.length-1,index));closePopup();const page=book.pages[current];$('pages').value=current;$('prev').disabled=current===0;$('next').disabled=current===book.pages.length-1;$('status').textContent=labels[page.status]||page.status;$('status').title=page.error||page.reason||'';$('scan').src=page.image;$('scan').alt='Original-PDF-Seite '+page.page;$('regions').replaceChildren();
if(page.data){$('scan').width=page.data.image_width;$('scan').height=page.data.image_height;page.data.words.forEach((word,index)=>{if(!word.pinyin&&!word.meaning)return;word.boxes.forEach(([x,y,w,h])=>{const button=document.createElement('button');button.className='region';button.dataset.word=index;button.setAttribute('aria-label',word.hanzi);Object.assign(button.style,{left:(100*x/page.data.image_width)+'%',top:(100*y/page.data.image_height)+'%',width:(100*w/page.data.image_width)+'%',height:(100*h/page.data.image_height)+'%'});button.addEventListener('click',event=>selectWord(index,event));$('regions').append(button)})})}else{$('scan').removeAttribute('width');$('scan').removeAttribute('height')}location.hash='page='+page.page;}
$('pages').onchange=()=>{showPage(Number($('pages').value));scrollTo(0,0)};$('prev').onclick=()=>{showPage(current-1);scrollTo(0,0)};$('next').onclick=()=>{showPage(current+1);scrollTo(0,0)};$('close').onclick=closePopup;$('boxes').onchange=()=>document.body.classList.toggle('boxes',$('boxes').checked);
document.addEventListener('keydown',event=>{if(['SELECT','INPUT'].includes(event.target.tagName))return;if(event.key==='Escape')closePopup();if(event.key==='ArrowRight')$('next').click();if(event.key==='ArrowLeft')$('prev').click()});
const initial=Number(new URLSearchParams(location.hash.slice(1)).get('page'));showPage(Math.max(0,book.pages.findIndex(p=>p.page===initial)));
</script></html>
